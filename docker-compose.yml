services:
  p5assets:
    image: ghcr.io/p5lukas/p5assets:dev
    # or build locally: build: .
    container_name: p5assets
    restart: unless-stopped
    ports:
      - "8484:8080"
    environment:
      - PUID=99
      - PGID=100
    volumes:
      - ./config:/config
      # Derselbe Ordner, den Kometa als asset_directory nutzt:
      - /pfad/zu/kometa/config/assets:/assets
      # Optional: second world (e.g. 4K) with its own assets folder
      # - /pfad/zu/kometa-4k/config/assets:/assets-4k
