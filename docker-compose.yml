services:
  p5assets:
    image: ghcr.io/p5lukas/p5assets:dev
    # or build from source: build: .
    container_name: p5assets
    restart: unless-stopped
    ports:
      - "8484:8080"
    environment:
      - PUID=99
      - PGID=100
    volumes:
      - ./config:/config
      # The same folder Kometa uses as asset_directory (must be writable):
      - /path/to/kometa/config/assets:/assets
      # Optional: a second world (e.g. 4K) with its own assets folder
      # - /path/to/kometa-4k/config/assets:/assets-4k
