services:
  p5assets:
    image: ghcr.io/p5lukas/p5assets:latest
    # oder lokal bauen: build: .
    container_name: p5assets
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PUID=99
      - PGID=100
    volumes:
      - ./config:/config
      # Derselbe Ordner, den Kometa als asset_directory nutzt:
      - /pfad/zu/kometa/config/assets:/assets
      # Optional: zweite Welt (z. B. 4K) mit eigenem Assets-Ordner
      # - /pfad/zu/kometa-4k/config/assets:/assets-4k
